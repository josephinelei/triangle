<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>畫三角形的高 - iPad 數學互動小工具</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* 防止 iPad 拖動頁面 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f1f5f9;
            overflow: hidden;
        }

        /* SVG 畫布區域 */
        #workspace-container {
            touch-action: none;
        }

        /* 粗黑色網格線 */
        .grid-line-bold {
            stroke: #000000;
            stroke-width: 1.8;
            stroke-opacity: 0.85;
        }

        /* 三角形實體外框 (黑色粗線) */
        .triangle-border {
            stroke: #000000;
            stroke-width: 4.5;
            fill: none;
            stroke-linejoin: round;
            stroke-linecap: round;
        }

        /* 塗色模式 - 鮮綠色半透明 */
        .triangle-fill-green {
            fill: #22c55e;
            fill-opacity: 0.45;
            transition: fill-opacity 0.25s ease;
        }

        /* 高 (紅色粗虛線) */
        .altitude-line {
            stroke: #ef4444;
            stroke-width: 3.5;
            stroke-dasharray: 7 5;
            stroke-linecap: round;
        }

        /* 底邊延長線 (灰色虛線) */
        .extension-line {
            stroke: #64748b;
            stroke-width: 2.5;
            stroke-dasharray: 5 5;
            stroke-linecap: round;
        }

        /* 直角符號 */
        .right-angle-mark {
            stroke: #ef4444;
            stroke-width: 2.5;
            fill: none;
            stroke-linejoin: round;
        }

        /* 頂點點擊大熱區 (iPad 觸控優化) */
        .vertex-hit-area {
            fill: transparent;
            cursor: pointer;
        }

        .vertex-dot {
            fill: #0f172a;
            transition: transform 0.2s, fill 0.2s;
        }

        .vertex-hit-area:active + .vertex-dot,
        .vertex-dot.active {
            fill: #ef4444;
            r: 8;
        }

        .vertex-label {
            font-size: 22px;
            font-weight: 800;
            fill: #020617;
            pointer-events: none;
            text-shadow: 0px 0px 4px rgba(255, 255, 255, 0.9);
        }

        /* 直角尺 (加長版) 樣式 */
        .ruler-body {
            fill: rgba(250, 204, 21, 0.72); /* 琥珀黃半透明 */
            stroke: #b45309;
            stroke-width: 2.5;
            stroke-linejoin: round;
        }

        .ruler-ticks {
            stroke: #78350f;
            stroke-width: 1.5;
        }

        /* 直角尺兩條直角邊的長距離延伸對齊線 (紅色/藍色細虛線) */
        .ruler-extend-axis-x {
            stroke: #2563eb;
            stroke-width: 2;
            stroke-dasharray: 6 4;
            opacity: 0.85;
        }

        .ruler-extend-axis-y {
            stroke: #dc2626;
            stroke-width: 2;
            stroke-dasharray: 6 4;
            opacity: 0.85;
        }

        /* 旋轉控制手柄 */
        .ruler-rotate-handle {
            fill: #ef4444;
            stroke: #ffffff;
            stroke-width: 3;
            cursor: grab;
            filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.3));
        }

        .ruler-rotate-handle:active {
            cursor: grabbing;
            fill: #dc2626;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-2 md:p-4 select-none">

    <!-- 控制列 -->
    <header class="w-full max-w-6xl mx-auto bg-white rounded-2xl shadow-md p-3 mb-2 border border-slate-200 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2">
            <span class="text-2xl">📐</span>
            <h1 class="text-lg md:text-xl font-bold text-slate-800">畫三角形的高</h1>
            <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-semibold hidden sm:inline-block">iPad 觸控優化版</span>
        </div>

        <!-- 按鈕操作區 -->
        <div class="flex flex-wrap items-center gap-2">
            <!-- 選擇三角形種類 -->
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                <label for="triangle-select" class="text-xs md:text-sm font-bold text-slate-700 pl-2">類型：</label>
                <select id="triangle-select" class="bg-white text-slate-800 text-xs md:text-sm font-semibold py-1.5 px-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="acute">銳角不等邊三角形</option>
                    <option value="obtuse">鈍角不等邊三角形</option>
                    <option value="isosceles">等腰三角形</option>
                    <option value="right">直角三角形</option>
                    <option value="equilateral">近似等邊三角形</option>
                </select>
            </div>

            <!-- 直角尺開關 -->
            <button id="btn-ruler" class="px-3 py-2 text-xs md:text-sm font-bold rounded-xl border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 active:scale-95 transition flex items-center gap-1 shadow-sm">
                <span>📏</span> <span id="ruler-btn-text">直角尺 (隱藏)</span>
            </button>

            <!-- 綠色塗色按鈕 -->
            <button id="btn-color" class="px-3 py-2 text-xs md:text-sm font-bold rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-800 hover:bg-emerald-100 active:scale-95 transition flex items-center gap-1 shadow-sm">
                <span>🎨</span> <span id="color-btn-text">塗色 (關)</span>
            </button>

            <!-- 清除高 -->
            <button id="btn-clear" class="px-3 py-2 text-xs md:text-sm font-bold rounded-xl border border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100 active:scale-95 transition flex items-center gap-1 shadow-sm">
                <span>🔄</span> <span>清除高</span>
            </button>

            <!-- 重置直角尺 -->
            <button id="btn-reset-ruler" class="px-2.5 py-2 text-xs md:text-sm font-bold rounded-xl border border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200 active:scale-95 transition" title="重置直角尺位置">
                🎯 重設尺位置
            </button>
        </div>
    </header>

    <!-- 操作指引提示 -->
    <div class="w-full max-w-6xl mx-auto bg-blue-50 border-l-4 border-blue-500 text-blue-800 text-xs md:text-sm p-2 px-3 rounded-r-xl mb-2 flex items-center justify-between">
        <div>
            👉 <b>操作說明：</b> 輕點頂點 <b>A / B / C</b> 顯示或隱藏高；開啟<b>直角尺</b>後可拖拽尺身移位，拖拽<b>紅色圓圈</b>旋轉，利用延伸線精確量度距離。
        </div>
        <div id="degree-readout" class="hidden font-mono font-bold bg-white px-2 py-0.5 rounded border border-blue-200 text-blue-700 text-xs">
            角度: 0°
        </div>
    </div>

    <!-- SVG 工作區 -->
    <main id="workspace-container" class="w-full max-w-6xl flex-1 bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden relative">
        <svg id="svg-workspace" class="w-full h-full block" viewBox="0 0 920 600" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- 粗黑色網格 Pattern (40x40 像素單位) -->
                <pattern id="gridPatternBold" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" class="grid-line-bold" />
                </pattern>
            </defs>

            <!-- 背景粗黑色網格 -->
            <rect width="100%" height="100%" fill="url(#gridPatternBold)" />

            <!-- 三角形層 (塗色 + 粗黑邊框) -->
            <g id="triangle-group">
                <polygon id="triangle-fill" class="triangle-fill-green" style="fill-opacity: 0;" />
                <polygon id="triangle-border" class="triangle-border" />
            </g>

            <!-- 底邊延伸線層 (當高落在外部時自動生成) -->
            <g id="extensions-layer"></g>

            <!-- 高與直角符號層 -->
            <g id="altitudes-layer"></g>

            <!-- 頂點圓點與字母標籤層 -->
            <g id="vertices-layer"></g>

            <!-- 加長版直角尺 (三角尺 90°-60°-30°) -->
            <g id="ruler-group" style="display: none;">
                <!-- 1. 直角邊延伸對齊輔助線 (超長對齊線，方便跨越遠距離頂點) -->
                <!-- 底邊 X 軸延伸光線 (-400px 到 +900px) -->
                <line class="ruler-extend-axis-x" x1="-400" y1="0" x2="900" y2="0" />
                <!-- 垂直 Y 軸延伸光線 (+200px 到 -800px) -->
                <line class="ruler-extend-axis-y" x1="0" y1="200" x2="0" y2="-800" />

                <!-- 2. 大尺寸直角尺本體 (直角在 0,0 ; 底長 440px ; 高 320px) -->
                <path class="ruler-body" d="M 0 0 L 440 0 L 0 -320 Z M 40 -35 L 320 -35 L 40 -240 Z" />

                <!-- 3. 刻度線條 -->
                <g id="ruler-ticks-group" class="ruler-ticks"></g>

                <!-- 4. 直角符號標記 (在尺的直角頂點處) -->
                <path d="M 0 -20 L 20 -20 L 20 0" fill="none" stroke="#78350f" stroke-width="2" />
                <circle cx="0" cy="0" r="4" fill="#ef4444" /> <!-- 原點標記 -->

                <!-- 5. 旋轉手柄 (長臂遠端，方便 iPad 手指遮擋時操作) -->
                <g id="rotate-handle-group">
                    <line x1="200" y1="-140" x2="250" y2="-175" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" />
                    <circle id="rotate-handle" class="ruler-rotate-handle" cx="250" cy="-175" r="20" />
                    <!-- 旋轉箭頭圖示 -->
                    <path d="M 243 -175 A 7 7 0 1 1 257 -175" fill="none" stroke="white" stroke-width="2.5" pointer-events="none" />
                    <polygon points="257,-179 261,-175 257,-171" fill="white" pointer-events="none" />
                </g>
            </g>
        </svg>
    </main>

    <script>
        // 網格單位 (40px)
        const GRID = 40;

        // 五種三角形預設值 (所有頂點 100% 精確落在 40px 網格交點上)
        const TRIANGLE_PRESETS = {
            acute: {
                name: "銳角不等邊三角形",
                vertices: {
                    A: { x: 8 * GRID, y: 3 * GRID },   // (320, 120)
                    B: { x: 3 * GRID, y: 12 * GRID },  // (120, 480)
                    C: { x: 18 * GRID, y: 12 * GRID }  // (720, 480)
                }
            },
            obtuse: {
                name: "鈍角不等邊三角形",
                vertices: {
                    A: { x: 4 * GRID, y: 3 * GRID },   // (160, 120)
                    B: { x: 9 * GRID, y: 12 * GRID },  // (360, 480) - 鈍角頂點
                    C: { x: 19 * GRID, y: 12 * GRID }  // (760, 480)
                }
            },
            isosceles: {
                name: "等腰三角形",
                vertices: {
                    A: { x: 11 * GRID, y: 3 * GRID },  // (440, 120) - 中軸線上的頂點
                    B: { x: 4 * GRID, y: 12 * GRID },  // (160, 480)
                    C: { x: 18 * GRID, y: 12 * GRID }  // (720, 480)
                }
            },
            right: {
                name: "直角三角形",
                vertices: {
                    A: { x: 5 * GRID, y: 3 * GRID },   // (200, 120)
                    B: { x: 5 * GRID, y: 12 * GRID },  // (200, 480) - 直角頂點
                    C: { x: 17 * GRID, y: 12 * GRID }  // (680, 480)
                }
            },
            equilateral: {
                name: "近似等邊三角形",
                vertices: {
                    A: { x: 11 * GRID, y: 3 * GRID },  // (440, 120)
                    B: { x: 4 * GRID, y: 13 * GRID },  // (160, 520)
                    C: { x: 18 * GRID, y: 13 * GRID }  // (720, 520)
                }
            }
        };

        // 當前狀態變數
        let currentPreset = "acute";
        let isFilledGreen = false;
        let isRulerVisible = false;
        let activeAltitudes = { A: false, B: false, C: false };

        // 直角尺變換狀態 (位置與旋轉角度)
        let rulerState = {
            x: 400,
            y: 300,
            angle: 0
        };

        // DOM 元素引用
        const svg = document.getElementById('svg-workspace');
        const triangleFill = document.getElementById('triangle-fill');
        const triangleBorder = document.getElementById('triangle-border');
        const verticesLayer = document.getElementById('vertices-layer');
        const altitudesLayer = document.getElementById('altitudes-layer');
        const extensionsLayer = document.getElementById('extensions-layer');
        const rulerGroup = document.getElementById('ruler-group');
        const rotateHandle = document.getElementById('rotate-handle');
        const degreeReadout = document.getElementById('degree-readout');

        // 初始化直角尺刻度線 (底邊 440px，高 320px)
        function initRulerTicks() {
            const ticksGroup = document.getElementById('ruler-ticks-group');
            ticksGroup.innerHTML = '';

            // X 軸 (長直角邊) 刻度
            for (let x = 20; x <= 420; x += 10) {
                const isLong = (x % 50 === 0);
                const isMid = (x % 10 === 0 && !isLong);
                const h = isLong ? 14 : (x % 20 === 0 ? 8 : 5);

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x);
                line.setAttribute("y1", 0);
                line.setAttribute("x2", x);
                line.setAttribute("y2", -h);
                ticksGroup.appendChild(line);

                if (isLong) {
                    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    txt.setAttribute("x", x);
                    txt.setAttribute("y", -h - 4);
                    txt.setAttribute("font-size", "10");
                    txt.setAttribute("fill", "#78350f");
                    txt.setAttribute("text-anchor", "middle");
                    txt.textContent = x / 10;
                    ticksGroup.appendChild(txt);
                }
            }

            // Y 軸 (短直角邊) 刻度
            for (let y = 20; y <= 300; y += 10) {
                const isLong = (y % 50 === 0);
                const h = isLong ? 14 : (y % 20 === 0 ? 8 : 5);

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", 0);
                line.setAttribute("y1", -y);
                line.setAttribute("x2", h);
                line.setAttribute("y2", -y);
                ticksGroup.appendChild(line);

                if (isLong) {
                    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    txt.setAttribute("x", h + 8);
                    txt.setAttribute("y", -y + 3);
                    txt.setAttribute("font-size", "10");
                    txt.setAttribute("fill", "#78350f");
                    txt.setAttribute("text-anchor", "start");
                    txt.textContent = y / 10;
                    ticksGroup.appendChild(txt);
                }
            }
        }

        // 幾何計算：頂點 P 到線段 QR 的高與垂足 H
        function calculateAltitude(P, Q, R) {
            const dx = R.x - Q.x;
            const dy = R.y - Q.y;
            const lenSq = dx * dx + dy * dy;

            // 投影係數 t
            const t = ((P.x - Q.x) * dx + (P.y - Q.y) * dy) / lenSq;

            // 垂足 H 點座標
            const H = {
                x: Q.x + t * dx,
                y: Q.y + t * dy
            };

            // 判斷垂足是否落於邊 QR 外部 (需要畫底邊延長線)
            let extension = null;
            if (t < -0.001) {
                extension = { from: H, to: Q };
            } else if (t > 1.001) {
                extension = { from: R, to: H };
            }

            // 計算直角符號方向
            const baseLen = Math.sqrt(lenSq);
            const u = { x: dx / baseLen, y: dy / baseLen }; // 底邊單位向量

            const altDx = P.x - H.x;
            const altDy = P.y - H.y;
            const altLen = Math.sqrt(altDx * altDx + altDy * altDy);

            if (altLen < 1e-3) {
                // 如果高長度接近零 (例如直角三角形頂點就在底邊線上)
                return { P, H, extension: null, rightAnglePath: "" };
            }

            const v = { x: altDx / altLen, y: altDy / altLen }; // 高單位向量

            let dirU = u;
            if (t > 0.5) {
                dirU = { x: -u.x, y: -u.y };
            }

            const sz = 16; // 直角符號大小
            const p1 = { x: H.x + dirU.x * sz, y: H.y + dirU.y * sz };
            const p2 = { x: p1.x + v.x * sz, y: p1.y + v.y * sz };
            const p3 = { x: H.x + v.x * sz, y: H.y + v.y * sz };

            const rightAnglePath = `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y} L ${p3.x} ${p3.y}`;

            return { P, H, extension, rightAnglePath };
        }

        // 渲染三角形與頂點標籤
        function renderTriangle() {
            const V = TRIANGLE_PRESETS[currentPreset].vertices;
            const pointsStr = `${V.A.x},${V.A.y} ${V.B.x},${V.B.y} ${V.C.x},${V.C.y}`;

            triangleFill.setAttribute('points', pointsStr);
            triangleBorder.setAttribute('points', pointsStr);

            // 綠色塗色控制
            triangleFill.style.fillOpacity = isFilledGreen ? "0.45" : "0";

            // 繪製頂點與標籤
            verticesLayer.innerHTML = '';
            const labels = ['A', 'B', 'C'];
            const offsets = {
                A: { dx: 0, dy: -22 },
                B: { dx: -22, dy: 26 },
                C: { dx: 22, dy: 26 }
            };

            labels.forEach(lbl => {
                const pt = V[lbl];

                // 透明大觸控點 (直徑 56px，極易點擊)
                const hitCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                hitCircle.setAttribute('cx', pt.x);
                hitCircle.setAttribute('cy', pt.y);
                hitCircle.setAttribute('r', '28');
                hitCircle.setAttribute('class', 'vertex-hit-area');

                // 頂點實心小圓點
                const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                dot.setAttribute('cx', pt.x);
                dot.setAttribute('cy', pt.y);
                dot.setAttribute('r', '6.5');
                dot.setAttribute('class', `vertex-dot ${activeAltitudes[lbl] ? 'active' : ''}`);

                // 大寫英文字母標籤 (A, B, C)
                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute('x', pt.x + offsets[lbl].dx);
                text.setAttribute('y', pt.y + offsets[lbl].dy);
                text.setAttribute('class', 'vertex-label');
                text.setAttribute('text-anchor', 'middle');
                text.textContent = lbl;

                // 點擊頂點切換顯示該頂點的高
                hitCircle.addEventListener('pointerdown', (e) => {
                    e.stopPropagation();
                    activeAltitudes[lbl] = !activeAltitudes[lbl];
                    renderAltitudes();
                    renderTriangle(); // 更新頂點亮起狀態
                });

                verticesLayer.appendChild(hitCircle);
                verticesLayer.appendChild(dot);
                verticesLayer.appendChild(text);
            });

            renderAltitudes();
        }

        // 渲染高線 (Altitudes) 與底邊延長線
        function renderAltitudes() {
            altitudesLayer.innerHTML = '';
            extensionsLayer.innerHTML = '';

            const V = TRIANGLE_PRESETS[currentPreset].vertices;
            const pairs = {
                A: { P: V.A, Q: V.B, R: V.C },
                B: { P: V.B, Q: V.A, R: V.C },
                C: { P: V.C, Q: V.A, R: V.B }
            };

            Object.keys(activeAltitudes).forEach(lbl => {
                if (activeAltitudes[lbl]) {
                    const { P, Q, R } = pairs[lbl];
                    const data = calculateAltitude(P, Q, R);

                    // 1. 若高落在外部，自動補畫底邊延長線 (灰色虛線)
                    if (data.extension) {
                        const extLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        extLine.setAttribute('x1', data.extension.from.x);
                        extLine.setAttribute('y1', data.extension.from.y);
                        extLine.setAttribute('x2', data.extension.to.x);
                        extLine.setAttribute('y2', data.extension.to.y);
                        extLine.setAttribute('class', 'extension-line');
                        extensionsLayer.appendChild(extLine);
                    }

                    // 2. 畫高 (紅色粗虛線)
                    const altLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    altLine.setAttribute('x1', data.P.x);
                    altLine.setAttribute('y1', data.P.y);
                    altLine.setAttribute('x2', data.H.x);
                    altLine.setAttribute('y2', data.H.y);
                    altLine.setAttribute('class', 'altitude-line');
                    altitudesLayer.appendChild(altLine);

                    // 3. 畫垂足直角符號
                    if (data.rightAnglePath) {
                        const raPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        raPath.setAttribute('d', data.rightAnglePath);
                        raPath.setAttribute('class', 'right-angle-mark');
                        altitudesLayer.appendChild(raPath);
                    }
                }
            });
        }

        // 更新直角尺位置與旋轉角度
        function updateRulerTransform() {
            rulerGroup.setAttribute('transform', `translate(${rulerState.x}, ${rulerState.y}) rotate(${rulerState.angle})`);
            degreeReadout.textContent = `角度: ${Math.round(rulerState.angle)}°`;
        }

        // 螢幕座標轉 SVG 幾何座標
        function getSVGPoint(e) {
            const p = svg.createSVGPoint();
            p.x = e.clientX;
            p.y = e.clientY;
            return p.matrixTransform(svg.getScreenCTM().inverse());
        }

        let isDraggingRuler = false;
        let isRotatingRuler = false;
        let dragStart = { x: 0, y: 0 };
        let initialRulerPos = { x: 0, y: 0 };
        let initialAngle = 0;
        let rotateCenter = { x: 0, y: 0 };

        // 尺身拖動 (Move)
        rulerGroup.addEventListener('pointerdown', (e) => {
            if (e.target === rotateHandle) return; // 旋轉手柄交由專門事件處理
            e.stopPropagation();
            isDraggingRuler = true;
            const pt = getSVGPoint(e);
            dragStart = pt;
            initialRulerPos = { x: rulerState.x, y: rulerState.y };
            rulerGroup.setPointerCapture(e.pointerId);
        });

        // 尺旋轉 (Rotate)
        rotateHandle.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            isRotatingRuler = true;
            const pt = getSVGPoint(e);

            rotateCenter = { x: rulerState.x, y: rulerState.y };
            const v = { x: pt.x - rotateCenter.x, y: pt.y - rotateCenter.y };
            initialAngle = rulerState.angle - (Math.atan2(v.y, v.x) * 180 / Math.PI);

            rotateHandle.setPointerCapture(e.pointerId);
            degreeReadout.classList.remove('hidden');
        });

        // 移動與旋轉過程
        window.addEventListener('pointermove', (e) => {
            if (isDraggingRuler) {
                const pt = getSVGPoint(e);
                rulerState.x = initialRulerPos.x + (pt.x - dragStart.x);
                rulerState.y = initialRulerPos.y + (pt.y - dragStart.y);
                updateRulerTransform();
            } else if (isRotatingRuler) {
                const pt = getSVGPoint(e);
                const v = { x: pt.x - rotateCenter.x, y: pt.y - rotateCenter.y };
                let deg = Math.atan2(v.y, v.x) * 180 / Math.PI + initialAngle;

                // 規範角度在 -180 到 180 度之間
                deg = (deg + 180) % 360 - 180;

                // 2 度微吸附 (精確調整對齊)
                deg = Math.round(deg / 2) * 2;

                rulerState.angle = deg;
                updateRulerTransform();
            }
        });

        // 釋放 Pointer 監聽
        const stopRulerInteraction = (e) => {
            if (isDraggingRuler) isDraggingRuler = false;
            if (isRotatingRuler) {
                isRotatingRuler = false;
                setTimeout(() => degreeReadout.classList.add('hidden'), 1500);
            }
        };

        window.addEventListener('pointerup', stopRulerInteraction);
        window.addEventListener('pointercancel', stopRulerInteraction);

        // UI 按鈕事件綁定

        // 切換三角形種類
        document.getElementById('triangle-select').addEventListener('change', (e) => {
            currentPreset = e.target.value;
            activeAltitudes = { A: false, B: false, C: false };
            renderTriangle();
        });

        // 直角尺顯示/隱藏
        const btnRuler = document.getElementById('btn-ruler');
        const rulerBtnText = document.getElementById('ruler-btn-text');
        btnRuler.addEventListener('click', () => {
            isRulerVisible = !isRulerVisible;
            rulerGroup.style.display = isRulerVisible ? 'block' : 'none';
            btnRuler.classList.toggle('bg-amber-500', isRulerVisible);
            btnRuler.classList.toggle('text-white', isRulerVisible);
            btnRuler.classList.toggle('bg-amber-50', !isRulerVisible);
            btnRuler.classList.toggle('text-amber-800', !isRulerVisible);
            rulerBtnText.textContent = isRulerVisible ? '直角尺 (顯示中)' : '直角尺 (隱藏)';
        });

        // 綠色塗色切換
        const btnColor = document.getElementById('btn-color');
        const colorBtnText = document.getElementById('color-btn-text');
        btnColor.addEventListener('click', () => {
            isFilledGreen = !isFilledGreen;
            btnColor.classList.toggle('bg-emerald-600', isFilledGreen);
            btnColor.classList.toggle('text-white', isFilledGreen);
            btnColor.classList.toggle('bg-emerald-50', !isFilledGreen);
            btnColor.classList.toggle('text-emerald-800', !isFilledGreen);
            colorBtnText.textContent = isFilledGreen ? '塗色 (綠色已開)' : '塗色 (關)';
            renderTriangle();
        });

        // 清除高
        document.getElementById('btn-clear').addEventListener('click', () => {
            activeAltitudes = { A: false, B: false, C: false };
            renderTriangle();
        });

        // 重設直角尺位置到畫面中央
        document.getElementById('btn-reset-ruler').addEventListener('click', () => {
            rulerState = { x: 400, y: 300, angle: 0 };
            updateRulerTransform();
        });

        // 初始化繪製
        initRulerTicks();
        updateRulerTransform();
        renderTriangle();
    </script>
</body>
</html>
